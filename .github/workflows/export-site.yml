name: Export site ZIP

on:
  push:
    paths:
      - '.github/workflows/export-site.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          zip -r site.zip . -x ".git/*" ".github/workflows/export-site.yml"
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: site-zip
          path: site.zip
          retention-days: 1
